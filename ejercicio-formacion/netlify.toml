# Deploy como sitio propio en Netlify:
#   Site configuration › Build & deploy › Base directory = ejercicio-formacion
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
