# Config del sitio de PoweRH, para cuando Netlify lo despliega con
# "Base directory: poweRH". Con esa base, Netlify lee este archivo y publica
# esta carpeta como raíz del sitio: las cursadas quedan en /, no en /poweRH/.
#
# El resto del repositorio —la Biblioteca de Asistentes en la raíz, Power People
# en power-people/— no se toca: cada uno se despliega en su propio proyecto,
# con su propia base directory.

[build]
  command = "node scripts/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Las páginas de cada cursada, de cada bloque y la de cierre.
#
# No hay un archivo por cursada: el id sale de la columna "ID curso" de la hoja
# Cursos y el slug del nombre del bloque sale del currículo, así que /lo-que-sea
# sirve siempre una de estas tres páginas y es el JS el que decide qué mostrar.
# Una cursada nueva en la planilla estrena su página sin tocar el repo.
#
# El orden importa: /cierre tiene que ganarle a la regla de los bloques, que
# matchea cualquier segundo tramo.
#
# Netlify sirve primero los archivos que existen de verdad, así que
# /assets/…, /diagnostico.html y la portada ganan sobre estas reglas.
[[redirects]]
  from = "/:curso/cierre"
  to = "/cierre.html"
  status = 200

[[redirects]]
  from = "/:curso/:bloque"
  to = "/bloque.html"
  status = 200

[[redirects]]
  from = "/:curso"
  to = "/curso.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los assets los regenera cada build y las grabaciones salen del Sheet en vivo,
# así que no conviene cachearlos mucho.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
