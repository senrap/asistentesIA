# Config del sitio de los workshops, para cuando Netlify lo despliega con
# "Base directory: poweRH". Con esa base, Netlify lee este archivo y publica
# esta carpeta como raíz del sitio: los workshops quedan en /, no en /poweRH/.
#
# El resto del repositorio —la Biblioteca de Asistentes en la raíz, Power People
# en power-people/— no se toca: cada uno se despliega en su propio proyecto,
# con su propia base directory.

[build]
  command = "node scripts/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Las páginas de cada programa y de cada bloque.
#
# No hay un archivo por programa ni por bloque: el id sale de la columna ID de
# la hoja Workshops y el slug del nombre del bloque, así que /lo-que-sea sirve
# siempre programa.html o bloque.html y es el JS el que decide qué mostrar.
# Un workshop nuevo en la planilla estrena su página sin tocar el repo.
#
# Netlify sirve primero los archivos que existen de verdad, así que
# /assets/…, /diagnostico.html y la portada ganan sobre estas reglas.
[[redirects]]
  from = "/:programa/:bloque"
  to = "/bloque.html"
  status = 200

[[redirects]]
  from = "/:programa"
  to = "/programa.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los assets los regenera cada build y el contenido sale del Sheet en vivo,
# así que no conviene cachearlos mucho.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
