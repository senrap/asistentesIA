# Config del sitio de PoweRH, para cuando Netlify lo despliega con
# "Base directory: poweRH". Con esa base, Netlify lee este archivo y publica
# esta carpeta como raíz del sitio: el workshop queda en /, no en /poweRH/.
#
# El resto del repositorio —la Biblioteca de Asistentes en la raíz, Power People
# en power-people/— no se toca: cada uno se despliega en su propio proyecto,
# con su propia base directory.

[build]
  command = "node scripts/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Las sub-páginas de los bloques.
#
# No hay un archivo por bloque: los slugs salen del nombre que tiene cada uno
# en la planilla, así que /b/lo-que-sea sirve siempre bloque.html y es el JS
# el que decide qué mostrar. Un bloque nuevo en el Sheet estrena su página sin
# tocar el repo ni volver a deployar.
[[redirects]]
  from = "/b/*"
  to = "/bloque.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los assets los regenera cada build y el contenido sale del Sheet en vivo,
# así que no conviene cachearlos mucho.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
